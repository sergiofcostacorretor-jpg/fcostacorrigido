<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laudos e Autorizações com IA | FCosta Corretor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --verde-escuro:#1F4E3C;
    --verde-claro:#EDF3F0;
    --cinza-texto:#444;
    --cinza-claro:#888;
    --placeholder:#9a9a9a;
    --borda:#d8e3de;
    --bg:#f4f6f5;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:#1c1c1c;
    font-family:'Inter',sans-serif;
    padding:28px 16px 80px;
  }
  .topo{
    max-width:900px; margin:0 auto 22px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .topo h1{
    font-family:'Source Serif 4',serif; font-size:1.5rem; color:var(--verde-escuro); margin:0; font-weight:700;
  }
  .topo p{margin:2px 0 0; color:var(--cinza-claro); font-size:.85rem;}

  .abas{
    max-width:900px; margin:0 auto 18px; display:flex; gap:8px; flex-wrap:wrap;
  }
  .aba-btn{
    flex:1; min-width:170px; padding:12px 14px; border-radius:10px; border:1.5px solid var(--borda);
    background:#fff; color:var(--cinza-texto); font-family:'Inter',sans-serif; font-weight:600; font-size:.85rem;
    cursor:pointer; transition:all .15s ease; text-align:center;
  }
  .aba-btn.ativa{
    background:var(--verde-escuro); color:#fff; border-color:var(--verde-escuro);
    box-shadow:0 4px 14px rgba(31,78,60,.25);
  }
  .aba-btn:hover:not(.ativa){border-color:var(--verde-escuro); color:var(--verde-escuro);}

  .painel{display:none; max-width:900px; margin:0 auto;}
  .painel.ativo{display:block;}

  .caixa-ia{
    background:#fff; border:1.5px solid var(--borda); border-radius:14px; padding:20px 22px; margin-bottom:22px;
  }
  .caixa-ia label{display:block; font-weight:600; font-size:.85rem; color:var(--verde-escuro); margin-bottom:8px;}
  .caixa-ia textarea{
    width:100%; min-height:130px; border:1.5px solid var(--borda); border-radius:10px; padding:12px 14px;
    font-family:'Inter',sans-serif; font-size:.9rem; color:#222; resize:vertical;
  }
  .caixa-ia textarea:focus{outline:none; border-color:var(--verde-escuro);}
  .linha-botoes{display:flex; gap:10px; margin-top:12px; flex-wrap:wrap; align-items:center;}
  .btn{
    border:none; border-radius:9px; padding:11px 20px; font-family:'Inter',sans-serif; font-weight:600; font-size:.85rem;
    cursor:pointer; transition:opacity .15s ease; display:inline-flex; align-items:center; gap:8px;
  }
  .btn-ia{background:var(--verde-escuro); color:#fff;}
  .btn-pdf{background:#fff; color:var(--verde-escuro); border:1.5px solid var(--verde-escuro);}
  .btn-limpar{background:transparent; color:var(--cinza-claro); border:1.5px solid var(--borda);}
  .btn:hover{opacity:.85;}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .status-ia{font-size:.8rem; color:var(--cinza-claro); margin-left:4px;}
  .status-ia.erro{color:#b3261e;}
  .status-ia.ok{color:var(--verde-escuro); font-weight:600;}

  .documento{
    background:#fff; border-radius:4px; padding:46px 50px; box-shadow:0 8px 30px rgba(0,0,0,.08);
    font-family:'Inter',sans-serif; color:#222; line-height:1.55;
  }
  .doc-cabecalho{display:flex; align-items:center; gap:16px; border-bottom:2.5px solid var(--verde-escuro); padding-bottom:14px; margin-bottom:18px;}
  .doc-cabecalho img{width:56px; height:56px; border-radius:50%;}
  .doc-cabecalho .nome{font-family:'Source Serif 4',serif; font-weight:700; font-size:1.25rem; color:var(--verde-escuro);}
  .doc-cabecalho .info{font-size:.78rem; color:var(--cinza-texto);}

  .doc-titulo{text-align:center; font-family:'Source Serif 4',serif; font-weight:700; font-size:1.3rem; color:var(--verde-escuro); margin:8px 0 4px;}
  .doc-subtitulo{text-align:center; font-style:italic; font-size:.85rem; color:var(--cinza-texto); margin-bottom:20px;}

  h2.titulo-secao{
    font-family:'Source Serif 4',serif; color:var(--verde-escuro); font-size:1.02rem; font-weight:700;
    border-bottom:1.5px solid var(--verde-escuro); padding-bottom:5px; margin:26px 0 12px;
  }
  h3.clausula-titulo{color:var(--verde-escuro); font-size:.95rem; margin:16px 0 6px;}
  p.clausula-texto{font-size:.87rem; margin:0 0 8px;}
  .lei-bloco{border:1px solid var(--borda); border-radius:6px; overflow:hidden; margin:10px 0 16px;}
  .lei-header{background:var(--verde-escuro); color:#fff; font-weight:700; font-size:.7rem; padding:6px 10px; letter-spacing:.03em;}
  .lei-item{background:var(--verde-claro); font-size:.75rem; padding:6px 10px; border-top:1px solid #fff;}

  table.tbl-chave-valor{width:100%; border-collapse:collapse; margin:14px 0;}
  table.tbl-chave-valor td{border:1px solid var(--borda); padding:8px 12px; font-size:.85rem; vertical-align:top;}
  table.tbl-chave-valor td.chave{background:var(--verde-claro); font-weight:700; width:38%;}

  .valores-box{width:100%; border-collapse:collapse; margin:14px 0;}
  .valores-box td{border:1px solid var(--verde-escuro); padding:14px 16px;}
  .valores-box td.chave{background:var(--verde-escuro); color:#fff; font-weight:700; font-size:.95rem; width:58%;}
  .valores-box td.valor{background:var(--verde-escuro); color:#fff; font-weight:700; font-size:1.3rem; text-align:center;}

  .campo-edit{
    display:inline-block; min-width:60px; border-bottom:1.3px dotted var(--placeholder);
    padding:0 2px; color:#222;
  }
  .campo-edit:empty::before{content:attr(data-placeholder); color:var(--placeholder); font-style:italic;}
  .campo-edit:focus{outline:none; border-bottom-color:var(--verde-escuro); background:var(--verde-claro);}
  .campo-preenchido{color:#1c1c1c; font-style:normal; border-bottom-color:var(--verde-escuro);}

  .nota-italica{font-style:italic; font-size:.78rem; color:var(--cinza-claro); margin:6px 0 14px;}
  .bullet{font-size:.85rem; margin:4px 0;}

  .bloco-assinaturas{margin-top:34px;}
  .assinaturas{display:flex; gap:24px; flex-wrap:wrap; margin-top:30px;}
  .assinatura-box{flex:1; min-width:220px;}
  .linha-ass{border-top:1px solid #333; margin-top:46px;}
  .ass-nome{font-size:.85rem; margin-top:4px;}
  .ass-qualif{font-size:.75rem; color:var(--cinza-claro); margin-top:2px;}
  .titulo-testemunhas{text-align:center; font-weight:700; font-size:.8rem; color:var(--verde-escuro); margin-top:18px; letter-spacing:.05em;}

  .rodape-fcosta{border-top:1px solid #ccc; margin-top:26px; padding-top:10px; font-size:.72rem; color:#666;}

  @media print{
    body{background:#fff; padding:0;}
    .no-print{display:none !important;}
    .painel{display:block !important; max-width:none;}
    .painel:not(.ativo){display:none !important;}
    .documento{box-shadow:none; border-radius:0; padding:0;}
  }
</style>
</head>
<body>

<div class="topo no-print">
  <div>
    <h1>Laudos &amp; Autorizações com IA</h1>
    <p>Cole as informações do imóvel, deixe a IA organizar, revise e gere o PDF para o cliente assinar.</p>
  </div>
</div>

<div class="abas no-print">
  <button class="aba-btn ativa" data-aba="laudo" onclick="mudarAba('laudo')">📋 Laudo Geral</button>
  <button class="aba-btn" data-aba="com" onclick="mudarAba('com')">✍️ Autorização COM Exclusividade</button>
  <button class="aba-btn" data-aba="sem" onclick="mudarAba('sem')">✍️ Autorização SEM Exclusividade</button>
</div>

<!-- ============ PAINEL: LAUDO ============ -->
<div class="painel ativo" id="painel-laudo">
  <div class="caixa-ia no-print">
    <label>Cole aqui as informações do imóvel, proprietário e valores (texto solto, sem formatação especial):</label>
    <textarea id="texto-laudo" placeholder="Ex: Imóvel na Rua X, 123, Itaquera SP. Casa de 120m² em terreno de 200m². Matrícula 12345 do 5º RI. Proprietário João da Silva, CPF 000.000.000-00. Valor pedido R$ 450.000, avaliação de mercado R$ 420.000..."></textarea>
    <div class="linha-botoes">
      <button class="btn btn-ia" onclick="preencherComIA('laudo')">✨ Preencher com IA</button>
      <button class="btn btn-pdf" onclick="baixarPDF('laudo')">⬇️ Baixar PDF</button>
      <button class="btn btn-limpar" onclick="limparCampos('laudo')">Limpar campos</button>
      <span class="status-ia" id="status-laudo"></span>
    </div>
  </div>
  <div class="documento" id="doc-laudo"></div>
</div>

<!-- ============ PAINEL: COM EXCLUSIVIDADE ============ -->
<div class="painel" id="painel-com">
  <div class="caixa-ia no-print">
    <label>Cole aqui as informações do proprietário e do imóvel para a autorização COM exclusividade:</label>
    <textarea id="texto-com" placeholder="Ex: Proprietário Maria Souza, CPF 000.000.000-00, RG 00.000.000-0, mora na Rua Y, 456. Imóvel: apartamento na Rua Z, 789, 80m², matrícula 54321. Preço mínimo R$ 500.000. Prazo de 90 dias, comissão 6%..."></textarea>
    <div class="linha-botoes">
      <button class="btn btn-ia" onclick="preencherComIA('com')">✨ Preencher com IA</button>
      <button class="btn btn-pdf" onclick="baixarPDF('com')">⬇️ Baixar PDF</button>
      <button class="btn btn-limpar" onclick="limparCampos('com')">Limpar campos</button>
      <span class="status-ia" id="status-com"></span>
    </div>
  </div>
  <div class="documento" id="doc-com"></div>
</div>

<!-- ============ PAINEL: SEM EXCLUSIVIDADE ============ -->
<div class="painel" id="painel-sem">
  <div class="caixa-ia no-print">
    <label>Cole aqui as informações do proprietário e do imóvel para a autorização SEM exclusividade:</label>
    <textarea id="texto-sem" placeholder="Ex: Proprietário Carlos Lima, CPF 000.000.000-00, mora na Av. W, 321. Imóvel: terreno na Rua K, 999, 250m², matrícula 98765. Preço mínimo R$ 300.000. Prazo de 60 dias, comissão 6%..."></textarea>
    <div class="linha-botoes">
      <button class="btn btn-ia" onclick="preencherComIA('sem')">✨ Preencher com IA</button>
      <button class="btn btn-pdf" onclick="baixarPDF('sem')">⬇️ Baixar PDF</button>
      <button class="btn btn-limpar" onclick="limparCampos('sem')">Limpar campos</button>
      <span class="status-ia" id="status-sem"></span>
    </div>
  </div>
  <div class="documento" id="doc-sem"></div>
</div>

<script src="laudo-ia-modelos.js"></script>
<script>
const LOGO_URL = "logo-fcosta.png";
const CRECI = "CRECI-SP 294791-F";
const CNAI = "CNAI 52708";

function mudarAba(aba){
  document.querySelectorAll(".aba-btn").forEach(b=>b.classList.toggle("ativa", b.dataset.aba===aba));
  document.querySelectorAll(".painel").forEach(p=>p.classList.remove("ativo"));
  document.getElementById("painel-"+aba).classList.add("ativo");
}

function renderizarTodos(){
  document.getElementById("doc-laudo").innerHTML = montarLaudo();
  document.getElementById("doc-com").innerHTML = montarAutorizacaoCom();
  document.getElementById("doc-sem").innerHTML = montarAutorizacaoSem();
}

async function preencherComIA(tipo){
  const textarea = document.getElementById("texto-"+tipo);
  const status = document.getElementById("status-"+tipo);
  const texto = textarea.value.trim();
  if(!texto){ status.textContent = "Cole algum texto antes."; status.className="status-ia erro"; return; }

  status.textContent = "Preenchendo com IA...";
  status.className = "status-ia";

  try{
    const resp = await fetch("/.netlify/functions/preencher-ia", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ tipo, texto })
    });
    const data = await resp.json();
    if(!data.ok){
      status.textContent = "Erro: " + (data.error || "falha desconhecida");
      status.className = "status-ia erro";
      return;
    }
    aplicarCampos(tipo, data.campos);
    status.textContent = "✔ Campos preenchidos — revise antes de gerar o PDF.";
    status.className = "status-ia ok";
  }catch(e){
    status.textContent = "Erro de conexão: " + e.message;
    status.className = "status-ia erro";
  }
}

function aplicarCampos(tipo, campos){
  const doc = document.getElementById("doc-"+tipo);
  Object.keys(campos).forEach(chave=>{
    const valor = (campos[chave]||"").toString().trim();
    if(!valor) return;
    doc.querySelectorAll('[data-field="'+chave+'"]').forEach(span=>{
      span.textContent = valor;
      span.classList.add("campo-preenchido");
    });
  });
}

function limparCampos(tipo){
  if(!confirm("Limpar todos os campos preenchidos deste documento?")) return;
  const doc = document.getElementById("doc-"+tipo);
  doc.querySelectorAll(".campo-edit").forEach(span=>{
    span.textContent = "";
    span.classList.remove("campo-preenchido");
  });
  document.getElementById("status-"+tipo).textContent = "";
}

function baixarPDF(tipo){
  mudarAba(tipo);
  setTimeout(()=>window.print(), 80);
}

renderizarTodos();
</script>
</body>
</html>
