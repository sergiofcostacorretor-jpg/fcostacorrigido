[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200

[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/cadastro"
  to = "/painel_adm"
  status = 301

[[redirects]]
  from = "/avaliacao-fcosta"
  to = "/avaliacao"
  status = 200

[[redirects]]
  from = "/legislacaoimobiliaria"
  to = "/legislacao"
  status = 200

[[redirects]]
  from = "/parceiros-fcosta"
  to = "/parceria"
  status = 200

[[redirects]]
  from = "/inquilinato"
  to = "/inquilino"
  status = 200

[[redirects]]
  from = "/sergioig"
  to = "/sergio_ig"
  status = 200

[[redirects]]
  from = "/politica-de-privacidade"
  to = "/politica"
  status = 200

[[redirects]]
  from = "/videos-imobiliarios"
  to = "/tv_costa"
  status = 200

[[redirects]]
  from = "/condicoes-de-uso"
  to = "/certificado"
  status = 200

[[redirects]]
  from = "/portal-do-investidor"
  to = "/financiamento"
  status = 200

[[redirects]]
  from = "/documentacao-imobiliaria"
  to = "/cartorio"
  status = 200

[[redirects]]
  from = "/*"
  to = "/imovel.html"
  status = 200

# Segurança básica (ajuda navegadores e antivírus a confiar no site)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
