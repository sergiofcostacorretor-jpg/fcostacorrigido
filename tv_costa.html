<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Costa - FCosta Corretor</title>
<meta property="og:type" content="website"/>

<meta name="twitter:title" content="TV Costa - FCosta Corretor"/>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --vermelho: #dc1c2d;
            --branco: #ffffff;
            --preto: #070d18;
            --cinza: #8a9bb5;
            --altura-topo: 56px;
            --altura-barra: 64px;
        }

        html, body { height: 100%; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--preto);
            color: var(--branco);
            display: flex;
            flex-direction: column;
        }

        /* TOPO FINO */
        header {
            height: var(--altura-topo);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--vermelho);
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            font-weight: 800;
        }

        .logo img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
        }

        .topo-links { display: flex; gap: 8px; }

        .topo-links a {
            color: var(--branco);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.07);
            transition: background 0.2s;
        }

        .topo-links a:hover { background: var(--vermelho); }

        /* PALCO DO VÍDEO */
        main {
            flex: 0 0 calc(100vh - var(--altura-topo) - var(--altura-barra));
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px 0;
        }

        .palco {
            position: relative;
            width: 100%;
            /* usa o máximo de altura possível sem precisar rolar a página */
            max-width: calc((100vh - var(--altura-topo) - var(--altura-barra) - 24px) * 16 / 9);
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(220, 28, 45, 0.25);
        }

        .palco iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .btn-som {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            background: rgba(0, 0, 0, 0.75);
            color: var(--branco);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 999px;
            padding: 8px 18px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-som:hover { background: var(--vermelho); }

        .aviso {
            position: absolute;
            inset: 0;
            z-index: 6;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            text-align: center;
            padding: 24px;
            background: rgba(7, 13, 24, 0.95);
        }

        .aviso.ativo { display: flex; }
        .aviso p { max-width: 460px; color: #d5dcea; line-height: 1.5; }

        .aviso a {
            background: var(--vermelho);
            color: var(--branco);
            text-decoration: none;
            font-weight: 600;
            padding: 12px 22px;
            border-radius: 8px;
        }

        /* BARRA DE BAIXO */
        .barra {
            height: var(--altura-barra);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
            width: 100%;
            max-width: calc((100vh - var(--altura-topo) - var(--altura-barra) - 24px) * 16 / 9 + 40px);
            margin: 0 auto;
        }

        .titulo {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .controles { display: flex; gap: 8px; flex-shrink: 0; }

        .controles button {
            background: rgba(255, 255, 255, 0.08);
            color: var(--branco);
            border: 0;
            border-radius: 8px;
            padding: 10px 14px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .controles button:hover { background: var(--vermelho); }

        /* TOURS DOS IMOVEIS (vem do Firebase fcosta_imoveis -> tourMp4) */
        .tours { flex-shrink: 0; width: 100%; max-width: 1100px; margin: 24px auto 40px; padding: 0 20px; }
        .tours h2 { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--vermelho); margin-bottom: 4px; }
        .tours .sub { color: var(--cinza); font-size: 14px; margin-bottom: 16px; }
        .tours-grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .tour-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; overflow: hidden; }
        .tour-card video { width: 100%; aspect-ratio: 9 / 16; max-height: 420px; background: #000; display: block; object-fit: contain; }
        .tour-info { padding: 12px 14px 14px; }
        .tour-info strong { display: block; font-size: 15px; margin-bottom: 4px; }
        .tour-info span { display: block; font-size: 13px; color: var(--cinza); }
        .tour-info a { display: inline-block; margin-top: 10px; background: var(--vermelho); color: var(--branco); text-decoration: none; font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 8px; }

        @media (max-width: 700px) {
            .tours { padding: 0 12px; }
            header { padding: 0 12px; }
            main { padding: 10px 0 0; }
            .palco { border-radius: 0; max-width: 100%; }
            .barra { padding: 0 12px; max-width: 100%; }
            .controles button span { display: none; }
            .topo-links a span { display: none; }
        }
    </style>
<style id="tema-ouro">/* FCosta - paleta Preto & Ouro */:root{--vermelho:#A78340;--preto:#0A0B0F;}::selection{background:rgba(214,178,102,.35)}</style>
</head>
<body>
    <header>
        <a href="/" class="logo">
            <img src="https://i.postimg.cc/xTQzc3RV/495379823-122128221800669140-5238985291153506093-n-photoaidcom-cropped.png" alt="FCosta">
            <span>TV Costa</span>
        </a>
        <div class="topo-links">
            <a href="/"><i class="fas fa-arrow-left"></i> <span>Voltar ao site</span></a>
            <a href="https://www.youtube.com/playlist?list=PLdp-2xOUACEYX6KQWKVvwi_M0Vkdo3Ac1" target="_blank" rel="noopener"><i class="fab fa-youtube"></i> <span>YouTube</span></a>
        </div>
    </header>

    <main>
        <div class="palco">
            <div id="video-atual"></div>

            <button class="btn-som" id="btn-som" onclick="ativarSom()"><i class="fas fa-volume-high"></i> Ativar som</button>

            <div class="aviso" id="aviso">
                <i class="fab fa-youtube" style="font-size: 44px; color: var(--vermelho);"></i>
                <p id="aviso-texto">O vídeo não carregou aqui. Abra esta página pelo endereço do seu site (e não direto do arquivo no computador) ou assista pelo YouTube.</p>
                <a href="https://www.youtube.com/playlist?list=PLdp-2xOUACEYX6KQWKVvwi_M0Vkdo3Ac1" target="_blank" rel="noopener">Assistir no YouTube</a>
            </div>
        </div>
    </main>

    <div class="barra">
        <div class="titulo" id="video-titulo-atual">TV Costa</div>
        <div class="controles">
            <button onclick="videoAnterior()" title="Anterior"><i class="fas fa-backward-step"></i> <span>Anterior</span></button>
            <button onclick="pausarReproducao()" id="btn-pausa" title="Pausar"><i class="fas fa-pause"></i> <span>Pausar</span></button>
            <button onclick="proximoVideo()" title="Próximo"><i class="fas fa-forward-step"></i> <span>Próximo</span></button>
        </div>
    </div>

    <section class="tours" id="tours" hidden>
        <h2>Tours dos imóveis</h2>
        <p class="sub">Vídeos feitos pelo FCosta Corretor. Toque no vídeo para assistir.</p>
        <div class="tours-grade" id="tours-grade"></div>
    </section>

    <script>
        const PLAYLIST_ID = 'PLdp-2xOUACEYX6KQWKVvwi_M0Vkdo3Ac1';

        let ytPlayer = null;
        let ytPronto = false;
        let videos = [];          // vídeos cadastrados no painel (se houver)
        let videoAtual = 0;
        let modoPlaylist = true;  // sem vídeos cadastrados, toca a playlist do YouTube
        let reproduzindo = true;
        let tempoFalha = null;

        const abertoPeloSite = location.protocol === 'http:' || location.protocol === 'https:';

        // Carrega a API do YouTube
        const tagYT = document.createElement('script');
        tagYT.src = 'https://www.youtube.com/iframe_api';
        if (abertoPeloSite) document.head.appendChild(tagYT);

        function extrairIdYoutube(url) {
            if (!url) return '';
            url = url.trim();
            if (url.length === 11 && !url.includes('/')) return url;
            const m = url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/);
            return m ? m[1] : '';
        }

        function mostrarAviso() {
            document.getElementById('aviso').classList.add('ativo');
            document.getElementById('btn-som').style.display = 'none';
        }

        // Aberta direto do celular/computador (não pelo site): o YouTube bloqueia o vídeo
        if (!abertoPeloSite) {
            document.getElementById('aviso-texto').textContent =
                'Você abriu o arquivo direto do aparelho, e o YouTube não libera o vídeo assim. Publique a página no site (fcostacorretor.com) e abra pelo endereço. Enquanto isso, assista pelo YouTube.';
            mostrarAviso();
        }

        // Vídeo indisponível/privado/sem incorporação: pula sozinho para o próximo
        let errosSeguidos = 0;
        function aoDarErro(codigo) {
            const pulavel = (codigo === 100 || codigo === 101 || codigo === 150 || codigo === 5);
            errosSeguidos++;
            if (pulavel && errosSeguidos <= 30) {
                setTimeout(proximoVideo, 400);
                return;
            }
            mostrarErro(codigo);
        }

        function mostrarErro(codigo) {
            const motivos = {
                2: 'O endereço do vídeo ou da playlist está inválido.',
                5: 'O navegador não conseguiu reproduzir este vídeo.',
                100: 'A playlist ou o vídeo não foi encontrado, ou está como PRIVADO no YouTube. Deixe como Pública ou Não listada.',
                101: 'O dono do vídeo não permite que ele apareça em outros sites. No YouTube Studio, ative "Permitir incorporação".',
                150: 'O dono do vídeo não permite que ele apareça em outros sites. No YouTube Studio, ative "Permitir incorporação".',
                153: 'O YouTube bloqueou porque a página não foi aberta pelo endereço do site.'
            };
            document.getElementById('aviso-texto').textContent =
                (motivos[codigo] || 'O vídeo não carregou aqui.') + ' (código ' + codigo + ')';
            mostrarAviso();
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('video-atual', {
                width: '100%',
                height: '100%',
                playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0, modestbranding: 1 },
                events: {
                    onReady: () => { ytPronto = true; iniciar(); },
                    onStateChange: aoMudarEstado,
                    onError: (e) => aoDarErro(e.data)
                }
            });
            // Se em 12 segundos nada começou a tocar, mostra o aviso
            tempoFalha = setTimeout(() => { if (errosSeguidos === 0) mostrarAviso(); }, 12000);
        }

        function aoMudarEstado(e) {
            if (e.data === YT.PlayerState.PLAYING) {
                errosSeguidos = 0;
                clearTimeout(tempoFalha);
                document.getElementById('aviso').classList.remove('ativo');
                if (modoPlaylist) {
                    const dados = ytPlayer.getVideoData();
                    document.getElementById('video-titulo-atual').textContent = dados.title || 'TV Costa';
                }
            }
            // Vídeos do painel: quando termina, vai para o próximo (e volta ao primeiro no fim)
            if (!modoPlaylist && e.data === YT.PlayerState.ENDED && reproduzindo) proximoVideo();
        }

        function iniciar() {
            try { videos = JSON.parse(localStorage.getItem('fcosta_videos') || '[]'); } catch (e) { videos = []; }
            videos = videos.filter(v => v && extrairIdYoutube(v.url));
            modoPlaylist = videos.length === 0;

            if (modoPlaylist) {
                ytPlayer.loadPlaylist({ listType: 'playlist', list: PLAYLIST_ID, index: 0 });
                ytPlayer.setLoop(true);
            } else {
                exibirVideo(0);
            }
        }

        function exibirVideo(index) {
            videoAtual = index;
            const video = videos[index];
            const id = extrairIdYoutube(video.url);
            if (id) ytPlayer.loadVideoById(id);
            document.getElementById('video-titulo-atual').textContent = video.titulo || 'TV Costa';
        }

        function proximoVideo() {
            if (!ytPronto) return;
            if (modoPlaylist) { ytPlayer.nextVideo(); return; }
            exibirVideo((videoAtual + 1) % videos.length);
        }

        function videoAnterior() {
            if (!ytPronto) return;
            if (modoPlaylist) { ytPlayer.previousVideo(); return; }
            exibirVideo((videoAtual - 1 + videos.length) % videos.length);
        }

        function pausarReproducao() {
            if (!ytPronto) return;
            reproduzindo = !reproduzindo;
            const btn = document.getElementById('btn-pausa');
            if (reproduzindo) {
                ytPlayer.playVideo();
                btn.innerHTML = '<i class="fas fa-pause"></i> <span>Pausar</span>';
            } else {
                ytPlayer.pauseVideo();
                btn.innerHTML = '<i class="fas fa-play"></i> <span>Reproduzir</span>';
            }
        }

        function ativarSom() {
            if (!ytPronto) return;
            ytPlayer.unMute();
            ytPlayer.setVolume(100);
            document.getElementById('btn-som').style.display = 'none';
        }

        // Tours dos imóveis: lê o mesmo Firebase do site (fcosta_imoveis) e mostra quem tem tourMp4
        (function carregarTours() {
            const FB = 'https://fcosta2026-847c3-default-rtdb.firebaseio.com';
            const ehHttps = (u) => typeof u === 'string' && /^https:\/\//i.test(u);
            fetch(FB + '/fcosta_imoveis.json', { cache: 'no-store' })
                .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
                .then(dados => {
                    if (!dados || typeof dados !== 'object') return;
                    const itens = Object.keys(dados).map(k => Object.assign({ _id: k }, dados[k]))
                        .filter(i => i && typeof i === 'object' && ehHttps(i.tourMp4) &&
                                     i.publicado !== false && i._del !== true && i._excluido !== true);
                    if (!itens.length) return;
                    const grade = document.getElementById('tours-grade');
                    itens.forEach(i => {
                        const card = document.createElement('div');
                        card.className = 'tour-card';
                        const v = document.createElement('video');
                        v.controls = true; v.playsInline = true; v.preload = 'metadata';
                        v.src = i.tourMp4;
                        if (ehHttps(i.fotoDestaque)) v.poster = i.fotoDestaque;
                        const info = document.createElement('div');
                        info.className = 'tour-info';
                        const t = document.createElement('strong');
                        t.textContent = i.titulo || 'Imóvel';
                        info.appendChild(t);
                        const local = [i.bairro, i.cidade].filter(Boolean).join(' - ');
                        if (local) { const l = document.createElement('span'); l.textContent = local; info.appendChild(l); }
                        if (i.preco) { const pr = document.createElement('span'); pr.textContent = 'R$ ' + i.preco; info.appendChild(pr); }
                        const a = document.createElement('a');
                        a.href = '/imovel?id=' + encodeURIComponent(i._id);
                        a.textContent = 'Ver imóvel';
                        info.appendChild(a);
                        card.appendChild(v); card.appendChild(info);
                        grade.appendChild(card);
                    });
                    document.getElementById('tours').hidden = false;
                })
                .catch(() => { /* sem tours: a TV continua normal */ });
        })();
    </script>
</body>
</html>
